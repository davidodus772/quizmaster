<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>QuizMaster</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="app-header">
        <h1>QuizMaster</h1> 
        </header>
        <main>
            <!--Home Screen-->
            <section id="home-screen" class="screen active">
                <h2>Welsome!</h2>
                <p>Test your brain and beat your best score.</p>
                <button id="start-btn">Start Quiz</button>
            </section>
            <!--Quiz Screen-->
            <section id="quiz-screen" class="screen">
                <h2>Question 1.</h2>
                <p id="question-text">Your question will appear here.</p>
                <div id="options">
                    <button class="option-btn">Option A</button>
                    <button class="option-btn">Option B</button>
                    <button class="option-btn">Option C</button>
                    <button class="option-btn">Option D</button>
                </div>
                <button id="finish-btn">Finish (Test)</button>
            </section>
            <!--Result Screen-->
            <section id="result-screen" class="screen">
                <h2>Quiz Complete!</h2>
                <p>Your Score: <span id="final-score">0</span></p>
                <button id="home-btn">Back to Home</button>
            </section>
        </main>
        <footer>
            <p>Built by me with Techbase</p>
        </footer>
        <script src="js/app.js"></script>
    </body>
</html>
